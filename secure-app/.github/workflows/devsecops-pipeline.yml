name: DevSecOps Pipeline (Intentional Failure Demo)

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  security-and-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency vulnerability scan (pip-audit)
        id: dep_scan
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          pytest -q --disable-warnings --maxfail=1

      - name: Build container image
        id: build_image
        run: |
          docker build -t secure-app:demo .

      - name: Container vulnerability scan (Trivy)
        id: container_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-app:demo"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"

      - name: Enforce failing pipeline for training
        if: always()
        run: |
          echo "Dependency scan outcome: ${{ steps.dep_scan.outcome }}"
          echo "Unit tests outcome:      ${{ steps.unit_tests.outcome }}"
          echo "Container scan outcome:  ${{ steps.container_scan.outcome }}"

          failed_stages=""
          [ "${{ steps.dep_scan.outcome }}" = "failure" ] && failed_stages="$failed_stages dependency-scan"
          [ "${{ steps.unit_tests.outcome }}" = "failure" ] && failed_stages="$failed_stages unit-tests"
          [ "${{ steps.container_scan.outcome }}" = "failure" ] && failed_stages="$failed_stages container-scan"

          if [ -n "$failed_stages" ]; then
            echo "Pipeline FAILED. Failing stage(s):$failed_stages"
            exit 1
          fi

          # If scans/tests unexpectedly pass, still fail to keep demo behavior deterministic.
          echo "Pipeline FAILED intentionally for DevSecOps training demo."
          exit 1
