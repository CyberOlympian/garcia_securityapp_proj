name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency_scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --strict

  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: dependency_scan
    defaults:
      run:
        working-directory: secure-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  container_build:
    name: Container Build
    runs-on: ubuntu-latest
    needs: unit_tests
    defaults:
      run:
        working-directory: secure-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build --tag secure-app:${{ github.sha }} .

  container_scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: container_build
    defaults:
      run:
        working-directory: secure-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scan
        run: docker build --tag secure-app:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-app:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  deploy:
    name: Deploy (Demo)
    runs-on: ubuntu-latest
    needs: container_scan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: secure-app
    steps:
      - name: Simulated deployment
        run: |
          echo "Deploying secure-app:${{ github.sha }} to demo environment"
          echo "Deployment completed successfully"
