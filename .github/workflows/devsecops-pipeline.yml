name: DevSecOps Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: SAST, Dependency, and Secret Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scan tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install semgrep

      - name: Run dependency audit
        run: |
          pip-audit -r requirements.txt --strict | tee dependency-audit.txt

      - name: Run Semgrep SAST
        run: |
          semgrep scan --config .semgrep.yml --sarif --output semgrep.sarif app

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          output: secret-scan.txt
          exit-code: "1"

      - name: Write scan summary
        run: |
          cat > scan-summary.md <<EOF
          # Security Scan Summary

          - Dependency audit: passed
          - SAST: passed
          - Secret scan: passed
          - Commit SHA: ${{ github.sha }}
          EOF

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scans-${{ github.sha }}
          path: |
            dependency-audit.txt
            semgrep.sarif
            secret-scan.txt
            scan-summary.md

  build:
    name: Build, Scan, and Trust
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build --tag secure-app:${{ github.sha }} .

      - name: Record image identifier
        run: |
          cat > image-identifier.txt <<EOF
          image_ref=secure-app:${{ github.sha }}
          commit_sha=${{ github.sha }}
          EOF

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-app:${{ github.sha }}
          format: table
          output: container-vulns.txt
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate container SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: secure-app:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Mark trusted build
        run: |
          cat > trusted-build.txt <<EOF
          trusted_build=true
          image_ref=secure-app:${{ github.sha }}
          commit_sha=${{ github.sha }}
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trusted-build-${{ github.sha }}
          path: |
            image-identifier.txt
            container-vulns.txt
            sbom.cdx.json
            trusted-build.txt
